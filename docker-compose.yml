version: "3.9"

# ─────────────────────────────────────────────
# 네트워크: leafy-net (서비스) / mgmt-net (관리)
# 수집기(Node Exporter, cAdvisor, Fluentd)만 양쪽 연결
# ─────────────────────────────────────────────
networks:
  leafy-net:
    driver: bridge
  mgmt-net:
    driver: bridge

# ─────────────────────────────────────────────
# 볼륨: 컨테이너 재시작 시 데이터 영속성 확보
# ─────────────────────────────────────────────
volumes:
  postgres_data:
  prometheus_data:
  loki_data:
  grafana_data:
  ollama_data:
  zeek_logs:            # Zeek conn.log (observer 내부 전달용)
  network_events:       # Canonical Network Event (JSONL) — #8 ingestion이 소비

services:

  # ════════════════════════════════════════════
  # leafy-net: 모니터링 대상 서비스 레이어
  # ════════════════════════════════════════════

  frontend:
    image: gicks/leafy-frontend:latest
    container_name: leafy-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs/leafy.crt:/etc/letsencrypt/live/leafy-pr.com/fullchain.pem:ro
      - ./certs/leafy.key:/etc/letsencrypt/live/leafy-pr.com/privkey.pem:ro
      - ./leafy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - leafy-net
    depends_on:
      - backend
    restart: unless-stopped
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        tag: "frontend"
        labels: "com.docker.compose.service"   # canonical service identity (#6)

  backend:
    image: gicks/leafy-backend:latest
    container_name: leafy-backend
    mem_limit: 512m          # ← 추가
    memswap_limit: 512m      # ← 추가 (swap 비활성화, 순수 메모리만)
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -XX:+UseSerialGC"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/leafy
      SPRING_DATASOURCE_USERNAME: leafy
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-leafy_secret}
      JWT_SECRET: ${JWT_SECRET}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus,metrics
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      KAKAO_MAP_API_KEY: ${KAKAO_MAP_API_KEY}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY:-dummy}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY:-dummy}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      CLOUDFRONT_URL: ${CLOUDFRONT_URL:-https://leafy-s3-bucket.s3.ap-northeast-2.amazonaws.com}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-leafy-s3-bucket}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      PLANT_ID_API_KEY: ${PLANT_ID_API_KEY:-dummy_plant_id_api_key}
      OPEN_WEATHER_API_KEY: ${OPEN_WEATHER_API_KEY:-dummy_open_weather_api_key}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-dummy_openai_api_key}
    networks:
      - leafy-net
      - mgmt-net
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        tag: "backend"
        labels: "com.docker.compose.service"   # canonical service identity (#6)

  db:
    image: postgres:16
    container_name: leafy-db
    environment:
      POSTGRES_DB: leafy
      POSTGRES_USER: leafy
      POSTGRES_PASSWORD: ${DB_PASSWORD:-leafy_secret}
    command: >
      postgres
      -c log_connections=on
      -c log_disconnections=on
      -c log_min_duration_statement=200
      -c log_line_prefix='%t [%p] user=%u,db=%d,client=%h '
      -c log_destination=stderr
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./leafy/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - leafy-net
    depends_on:
      - fluentd
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leafy"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        tag: "leafy-db"
        labels: "com.docker.compose.service"   # canonical service identity (#6)

  # ════════════════════════════════════════════
  # 수집기: leafy-net + mgmt-net 브릿지 역할
  # ════════════════════════════════════════════

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - mgmt-net
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - mgmt-net
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter
    command:
      - "--nginx.scrape-uri=http://frontend:80/stub_status"
    networks:
      - leafy-net
      - mgmt-net
    depends_on:
      - frontend
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://leafy:${DB_PASSWORD:-leafy_secret}@db:5432/leafy?sslmode=disable"
    networks:
      - leafy-net
      - mgmt-net
    depends_on:
      - db
    restart: unless-stopped

  fluentd:
    build: ./leafy/fluentd
    container_name: fluentd
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    volumes:
      - ./leafy/fluentd/fluent.conf:/fluentd/etc/fluent.conf
    networks:
      - leafy-net
      - mgmt-net
    restart: unless-stopped

  # ════════════════════════════════════════════
  # mgmt-net: 모니터링 저장/시각화 레이어
  # ════════════════════════════════════════════

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    networks:
      - mgmt-net
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    ports:
      - "9093:9093"
    networks:
      - mgmt-net
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      - ./monitoring/loki/rules:/loki/rules   # ← 이거 추가
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml -target=all
    networks:
      - mgmt-net
    restart: unless-stopped
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    networks:
      - mgmt-net
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  # ════════════════════════════════════════════
  # mgmt-net: AIOps 핵심 엔진
  # ════════════════════════════════════════════

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    gpus: all
    ports:
      - "11434:11434"            # eval 스크립트 호스트 직접 호출용
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - mgmt-net
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "1"   # 동시 요청 1개로 제한 (기본값이 이미 1이지만 명시)
      OLLAMA_MAX_QUEUE: "1"      # 큐 최대 1개 — 넘치면 503 반환
      OLLAMA_KEEP_ALIVE: "-1"
  pipeline:
    build: ./aiops/pipeline
    container_name: aiops-pipeline
    environment:
      LLM_TIMEOUT: "180"
      LLM_MODEL: "llama3.2:3b"
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      OLLAMA_URL: http://ollama:11434
      ALERTMANAGER_URL: http://alertmanager:9093
      REMEDIATION_URL: http://remediation:8001
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./aiops/pipeline/results:/app/results
    networks:
      - mgmt-net
    depends_on:
      - prometheus
      - loki
      - ollama
    restart: unless-stopped

  remediation:
    build: ./aiops/remediation
    container_name: aiops-remediation
    environment:
      PIPELINE_URL: http://pipeline:8000
      LOKI_URL: http://loki:3100
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    ports:
      - "8001:8001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - mgmt-net
    depends_on:
      - pipeline
    restart: unless-stopped

  # ════════════════════════════════════════════
  # Network Observability: Network Observer (#5)
  # Network traffic -> Zeek -> Canonical Network Event v1.0
  # Loki ingestion은 #8 범위이므로 여기서는 JSONL 생성까지만 한다.
  # ════════════════════════════════════════════

  network-observer-zeek:
    image: zeek/zeek:latest
    container_name: network-observer-zeek
    # backend의 network namespace를 공유한다 (#4에서 검증한 방식).
    # 이 하나로 frontend->backend(inbound)와 backend->db(outbound)를 모두 관측한다.
    network_mode: "service:backend"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # privileged 불필요 — 위 두 capability로 충분함을 #4에서 확인했다.
    volumes:
      # 단일 파일이 아니라 디렉터리를 마운트한다.
      # 파일 단위 bind mount는 편집 시 inode가 바뀌어도 컨테이너가 옛 내용을 계속 본다.
      - ./aiops/network-observer/zeek:/opt/observer:ro
      - zeek_logs:/zeek-logs
    # -C : Docker 가상 NIC는 checksum offload를 쓰므로 체크섬이 무효하다.
    #      이 옵션이 없으면 Zeek이 패킷을 무시해 conn_state=OTH, bytes=0만 남는다.
    # -i eth0 : backend는 multi-homed(eth0=leafy-net, eth1=mgmt-net)이므로
    #           interface를 한정해야 management traffic이 섞이지 않는다.
    command: >
      sh -c "cd /zeek-logs && exec zeek -C -i eth0 /opt/observer/local.zeek"
    depends_on:
      - backend
    restart: unless-stopped

  network-observer-enricher:
    build: ./aiops/network-observer
    container_name: network-observer-enricher
    environment:
      OBSERVER_CONFIG: /app/config/observer.yml
      ZEEK_CONN_LOG: /zeek-logs/conn.log
      LOG_LEVEL: INFO
    volumes:
      - ./aiops/network-observer/config:/app/config:ro
      - zeek_logs:/zeek-logs:ro
      - network_events:/var/log/network-observer
      # identity enrichment용 Docker metadata 조회 (read-only)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - mgmt-net
    depends_on:
      - network-observer-zeek
    restart: unless-stopped
