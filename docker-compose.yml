# 프로젝트 이름 고정. 폴더 이름이 다르게 clone돼도 네트워크·볼륨 이름이 같게 유지된다.
# remediation(aiops/remediation/actions/container.py)이 graduation-project_leafy-net 이름에 의존한다.
name: graduation-project

# ─────────────────────────────────────────────
# 네트워크: leafy-net (서비스) / mgmt-net (관리)
# 수집기(Node Exporter, cAdvisor, Fluentd)만 양쪽 연결
# ─────────────────────────────────────────────
networks:
  leafy-net:
    driver: bridge
    # 신뢰 프록시(frontend)를 고정 IP로 지정하기 위해 대역을 고정한다.
    # 앱 단독 배포 compose(10.203.0.0/24)와 겹치지 않게 다른 대역을 쓴다.
    # 172.16~31 대역은 Windows WSL2가 임의로 쓰는 경우가 있어 피했다.
    ipam:
      config:
        - subnet: 10.210.0.0/24
  mgmt-net:
    driver: bridge

# ─────────────────────────────────────────────
# 볼륨: 컨테이너 재시작 시 데이터 영속성 확보
# ─────────────────────────────────────────────
volumes:
  postgres_data:
  prometheus_data:
  loki_data:
  grafana_data:
  ollama_data:
  minio_data:          # 업로드 사진 + 도감 이미지 217장. 지우면 첫 기동에 73MB를 다시 받는다

services:

  # ════════════════════════════════════════════
  # leafy-net: 모니터링 대상 서비스 레이어
  # ════════════════════════════════════════════

  frontend:
    image: gicks/ai-ops-leafy-frontend:${FRONTEND_TAG:-latest}
    container_name: leafy-frontend
    ports:
      # 공개 노출 금지. 기본은 이 PC에서만 접속.
      # Windows 데모에서는 .env 에 LEAFY_BIND_IP=<Tailscale IP> 를 넣는다.
      - "${LEAFY_BIND_IP:-127.0.0.1}:80:80"
    environment:
      TZ: Asia/Seoul
      # nginx 앞의 신뢰 프록시. 지금은 nginx 앞에 아무것도 없으므로 비운다.
      TRUSTED_PROXIES: ""
    networks:
      leafy-net:
        ipv4_address: 10.210.0.10   # backend TRUSTED_PROXIES 와 짝
    depends_on:
      - backend
      - minio
    restart: unless-stopped
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        tag: "frontend"

  backend:
    image: gicks/ai-ops-leafy-backend:${BACKEND_TAG:-latest}
    container_name: leafy-backend
    mem_limit: 512m          # ← 추가
    memswap_limit: 512m      # ← 추가 (swap 비활성화, 순수 메모리만)
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60.0 -XX:+UseSerialGC"
      SPRING_PROFILES_ACTIVE: dev
      TZ: Asia/Seoul

      # --- DB (컨테이너 leafy-db) ---
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/leafy
      DB_USERNAME_DEV: leafy
      DB_PASSWORD_DEV: ${DB_PASSWORD:-leafy_secret}
      # dev 기본값 create-drop 은 종료 시 테이블을 지운다
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      # --- 인증 (dev 프로필 필수. base64, 256bit 이상. 없으면 기동 실패) ---
      JWT_SECRET_KEY_DEV: ${JWT_SECRET_KEY_DEV:?JWT_SECRET_KEY_DEV 를 .env 에 설정 (base64, 256bit 이상)}

      # --- 로그 ---
      # 백엔드 바로 앞 신뢰 프록시 = frontend 고정 IP 하나.
      # 대역 전체를 넣지 말 것: 게이트웨이(10.210.0.1)가 포함되면 외부 요청 전부를 믿게 된다.
      TRUSTED_PROXIES: 10.210.0.10/32
      # fluentd 를 json 으로 바꾸는 날 같이 켠다. 앱만 먼저 켜면 더 안 읽힌다.
      # LOG_FORMAT: com.leafy.global.logging.LeafyJsonFormatter

      # --- 저장소 (MinIO) ---
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: leafy
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY 를 .env 에 설정}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY 를 .env 에 설정 (8자 이상)}
      STORAGE_PUBLIC_BASE_URL: /files

      # --- 외부 API (없으면 해당 기능만 동작하지 않는다) ---
      PLANT_ID_API_KEY: ${PLANT_ID_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NONGSARO_API_KEY: ${NONGSARO_API_KEY:-}
      AIR_PURIFIY_KEY: ${AIR_PURIFIY_KEY:-}
      OPEN_WEATHER_API_KEY: ${OPEN_WEATHER_API_KEY:-}   # 변수 자체는 있어야 함(빈 값 허용)
    networks:
      - leafy-net
      - mgmt-net
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        tag: "backend"

  db:
    image: postgres:16
    container_name: leafy-db
    environment:
      POSTGRES_DB: leafy
      POSTGRES_USER: leafy
      POSTGRES_PASSWORD: ${DB_PASSWORD:-leafy_secret}
      TZ: Asia/Seoul
    command: >
      postgres
      -c log_connections=on
      -c log_disconnections=on
      -c log_min_duration_statement=200
      -c log_line_prefix='%t [%p] user=%u,db=%d,client=%h '
      -c log_destination=stderr
      -c log_timezone=Asia/Seoul
      -c timezone=Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./leafy/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - leafy-net
    depends_on:
      - fluentd
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leafy"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        tag: "leafy-db"

  minio:
    # 공식 이미지(quay.io·도커허브)와 바이너리 배포가 모두 중단되어, 같은 릴리스를 소스에서 빌드해 올린 것 (amd64·arm64)
    image: gicks/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: leafy-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY 를 .env 에 설정}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY 를 .env 에 설정 (8자 이상)}
      TZ: Asia/Seoul
    # 포트는 publish 하지 않는다. 브라우저는 frontend nginx 의 /files/ 로만 받는다(GET·HEAD만)
    volumes:
      - minio_data:/data
    networks:
      - leafy-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        tag: "minio"
        # network-poc 머지 후라면 다른 서비스와 맞춰 아래 줄도 넣는다
        # labels: "com.docker.compose.service"

  # ════════════════════════════════════════════
  # 수집기: leafy-net + mgmt-net 브릿지 역할
  # ════════════════════════════════════════════

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - mgmt-net
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - mgmt-net
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter
    command:
      - "--nginx.scrape-uri=http://frontend:8081/stub_status"
    networks:
      - leafy-net
      - mgmt-net
    depends_on:
      - frontend
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://leafy:${DB_PASSWORD:-leafy_secret}@db:5432/leafy?sslmode=disable"
    networks:
      - leafy-net
      - mgmt-net
    depends_on:
      - db
    restart: unless-stopped

  fluentd:
    build: ./leafy/fluentd
    container_name: fluentd
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    volumes:
      - ./leafy/fluentd/fluent.conf:/fluentd/etc/fluent.conf
    networks:
      - leafy-net
      - mgmt-net
    restart: unless-stopped

  # ════════════════════════════════════════════
  # mgmt-net: 모니터링 저장/시각화 레이어
  # ════════════════════════════════════════════

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    networks:
      - mgmt-net
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    ports:
      - "9093:9093"
    networks:
      - mgmt-net
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      - ./monitoring/loki/rules:/loki/rules   # ← 이거 추가
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml -target=all
    networks:
      - mgmt-net
    restart: unless-stopped
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    networks:
      - mgmt-net
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  # ════════════════════════════════════════════
  # mgmt-net: AIOps 핵심 엔진
  # ════════════════════════════════════════════

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    # GPU 는 docker-compose.gpu.yml 에서 켠다 (Mac 은 GPU 미지원)
    ports:
      - "11434:11434"            # eval 스크립트 호스트 직접 호출용
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - mgmt-net
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "1"   # 동시 요청 1개로 제한 (기본값이 이미 1이지만 명시)
      OLLAMA_MAX_QUEUE: "1"      # 큐 최대 1개 — 넘치면 503 반환
      OLLAMA_KEEP_ALIVE: "-1"
  pipeline:
    build: ./aiops/pipeline
    container_name: aiops-pipeline
    environment:
      LLM_TIMEOUT: "180"
      LLM_MODEL: "llama3.2:3b"
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      OLLAMA_URL: http://ollama:11434
      ALERTMANAGER_URL: http://alertmanager:9093
      REMEDIATION_URL: http://remediation:8001
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./aiops/pipeline/results:/app/results
    networks:
      - mgmt-net
    depends_on:
      - prometheus
      - loki
      - ollama
    restart: unless-stopped

  remediation:
    build: ./aiops/remediation
    container_name: aiops-remediation
    environment:
      PIPELINE_URL: http://pipeline:8000
      LOKI_URL: http://loki:3100
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    ports:
      - "8001:8001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - mgmt-net
    depends_on:
      - pipeline
    restart: unless-stopped
