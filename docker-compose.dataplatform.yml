# Leafy Data Platform — Airflow 오케스트레이션 (Issue #38)
#
# 기존 docker-compose.yml / docker-compose.aiops.yml 와 독립된 project 다.
# depends_on·volume·network 를 공유하지 않으므로 이 스택이 멈춰도 실시간 RCA 경로에 영향이 없다.
# Bronze phase 는 DP_LOKI_URL / DP_PROMETHEUS_URL 로 읽기 전용 질의만 한다. 기본값은 이 Compose 의
# dp-mock-sources(STEP 0 fixture 를 답하는 mock Loki/Prometheus)이며 실제 Loki/Prometheus 에는 접근하지 않는다.
# lineage.run 에 남길 git sha 를 반드시 넘긴다(03 §2: 모르면 실행 거부).
#
#   DP_GIT_SHA=$(git rev-parse HEAD) DP_GIT_DIRTY=$(test -z "$(git status --porcelain)" && echo false || echo true) \
#     docker compose -f docker-compose.dataplatform.yml up -d
#   UI: http://127.0.0.1:18080   (loopback 전용, 로컬 개발용으로 로그인 생략)
#   docker compose -f docker-compose.dataplatform.yml down      # 데이터 유지
#   docker compose -f docker-compose.dataplatform.yml down -v   # lake·메타DB 삭제
#
# 시나리오 실행 기록(scenarios/v2 runs.jsonl, #71)은 DP_SCENARIO_RUNS_DIR 폴더의 DP_SCENARIO_RUN_FILE 을 읽기 전용으로
# 읽는다. 기본값은 fixture 의 02_scenario_runs.jsonl 이다.
#   같은 호스트(맥 all-in-one): DP_SCENARIO_RUNS_DIR=./scenarios/v2/fixtures_data DP_SCENARIO_RUN_FILE=runs.jsonl
#   분리 구성: Leafy 장비의 runs.jsonl 을 AIOps 장비의 폴더로 복사한 뒤 그 폴더를 DP_SCENARIO_RUNS_DIR 로 준다(자동 전송 없음).
#   파일이 없으면 획득은 failed(file_not_found) 로 남고 gold.scenario_link 는 run_log_unavailable 이 된다.
name: leafy-datalake

x-airflow-env: &airflow-env
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${DP_AIRFLOW_DB_PASSWORD:-airflow}@dp-airflow-db/airflow
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__PARALLELISM: "2"
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
  # 로컬 loopback 전용 개발 편의. 공유 환경에서는 제거하고 인증을 켠다.
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
  PYTHONPATH: /opt/airflow/dataplatform
  PYTHONDONTWRITEBYTECODE: "1"
  DP_LAKE_ROOT: /opt/airflow/lake
  DP_FIXTURE_DIR: /opt/airflow/fixtures
  DP_PIPELINE_DIR: /opt/airflow/pipeline
  DP_ALLOWLIST_PATH: /opt/airflow/policy/allowlist.yml
  DP_LOKI_URL: ${DP_LOKI_URL:-http://dp-mock-sources:3100}
  DP_PROMETHEUS_URL: ${DP_PROMETHEUS_URL:-http://dp-mock-sources:3100}
  DP_SCENARIO_RUN_LOG: /opt/airflow/scenario_runs/${DP_SCENARIO_RUN_FILE:-02_scenario_runs.jsonl}
  DP_GIT_SHA: ${DP_GIT_SHA:-}
  DP_GIT_DIRTY: ${DP_GIT_DIRTY:-false}
  DP_ENV: ${DP_ENV:-development}
  # dp_incident_discover (#68): Loki {job="aiops-llm"} 스캔. 기본 15분 창·실행당 8창·첫 실행 1시간 lookback.
  # DP_DISCOVER_RELATED 는 JSON 규칙 [{"match": {...}, "related_scopes": [...]}] (없으면 alert identity 만).
  DP_DISCOVER_START: ${DP_DISCOVER_START:-}
  DP_DISCOVER_LOOKBACK_S: ${DP_DISCOVER_LOOKBACK_S:-3600}
  DP_DISCOVER_RELATED: ${DP_DISCOVER_RELATED:-}

services:
  dp-airflow-db:
    image: postgres:16.16
    container_name: dp-airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${DP_AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: airflow
    volumes:
      - dp_airflow_db:/var/lib/postgresql/data
    networks: [datalake-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped

  # Named volume 은 root 소유로 생성되므로 Airflow 사용자(uid 50000)가 쓸 수 있게 한 번만 맞춘다.
  dp-lake-init:
    image: apache/airflow:3.3.2-python3.11
    user: "0:0"
    entrypoint: ["bash", "-c", "chown -R 50000:0 /opt/airflow/lake"]
    volumes:
      - dp_lake:/opt/airflow/lake
    networks: [datalake-net]

  # Mock Loki + Prometheus: STEP 0 fixture Bronze 행으로 답한다(읽기 전용 GET, 외부 publish 없음).
  dp-mock-sources:
    image: apache/airflow:3.3.2-python3.11
    container_name: dp-mock-sources
    working_dir: /opt/airflow/dataplatform
    entrypoint: ["python", "-m", "mock_sources.server", "--port", "3100"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      DP_FIXTURE_DIR: /opt/airflow/fixtures
    volumes:
      - ./aiops/dataplatform:/opt/airflow/dataplatform:ro
      - ./docs/data-platform/examples/db-connection-limit:/opt/airflow/fixtures:ro
    networks: [datalake-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3100/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    cpus: 0.25
    restart: unless-stopped

  dp-airflow:
    image: apache/airflow:3.3.2-python3.11
    container_name: dp-airflow
    depends_on:
      dp-airflow-db:
        condition: service_healthy
      dp-lake-init:
        condition: service_completed_successfully
      dp-mock-sources:
        condition: service_healthy
    environment: *airflow-env
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        airflow pools set loki_read 1 "Loki read serialization (02 §6)" &&
        airflow pools set prom_read 1 "Prometheus read serialization (02 §6)" &&
        exec airflow standalone
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./aiops/dataplatform/airflow/dags:/opt/airflow/dags:ro
      - ./aiops/dataplatform:/opt/airflow/dataplatform:ro
      # aiops/pipeline 모듈(identity·correlation·log_line…)과 allowlist 는 읽기 전용으로만 재사용한다(05 §3.2).
      - ./aiops/pipeline:/opt/airflow/pipeline:ro
      - ./aiops/policy:/opt/airflow/policy:ro
      - ./docs/data-platform/examples/db-connection-limit:/opt/airflow/fixtures:ro
      - ${DP_SCENARIO_RUNS_DIR:-./docs/data-platform/examples/db-connection-limit}:/opt/airflow/scenario_runs:ro
      - dp_lake:/opt/airflow/lake
    networks: [datalake-net]
    mem_limit: 3g
    cpus: 2
    restart: unless-stopped

volumes:
  dp_airflow_db:
  dp_lake:

networks:
  datalake-net:
