# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ko-KR
tone_instructions: "버그·보안·성능·테스트 누락을 근거와 재현 조건으로 설명하세요. 사소한 스타일 지적은 줄이고 실제 실행 검증과 모의 테스트를 구분하세요."
reviews:
  profile: chill
  # Current schema retains this legacy alias; explicitly disable both forms.
  request_changes_workflow: false
  auto_approvals:
    enabled: false
    allow_author_approval: false
  poem: false
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
  path_filters:
    - "!docs/scenarios-v2/heldout/**"
    - "!scenarios/v2/heldout/**"
    - "!certs/**"
    - "!**/.env"
  path_instructions:
    - path: "aiops/pipeline/**"
      instructions: >-
        FastAPI 입력/출력 계약, Pydantic 검증, 비동기 HTTP 타임아웃, 로그·메트릭·네트워크 상관관계,
        프롬프트 비밀정보 마스킹과 LLM 출력 실패 처리를 검토하세요. 실제 모델·외부 서비스 호출 성공을 추정하지 마세요.
    - path: "aiops/remediation/**"
      instructions: >-
        disabled 안전 기본값, 정책 allowlist, 승인·인증·서명·재전송 방지, 멱등성, TTL 복구,
        로컬/원격 executor 경계와 실패 시 자동 조치 차단을 검토하세요. 실제 Docker·Slack 호출이 없는 모의 테스트를 우선하세요.
    - path: "aiops/network-observer/**"
      instructions: >-
        플랫폼별 캡처 경계, Canonical Network Event 호환성, 서비스 식별, Zeek 재시작과 중복·유실을 검토하세요.
    - path: "leafy/**"
      instructions: >-
        이 경로는 DB 초기화·Nginx 설정·Fluentd Ruby 필터입니다. 외부 frontend/backend 이미지의 소스가 있다고 가정하지 마세요.
        로그 파싱·크기 제한·비밀정보 마스킹·원본 이벤트 호환성을 확인하세요.
    - path: "monitoring/**"
      instructions: >-
        Prometheus/Loki 룰과 라벨·대시보드 호환성, 누락 시계열, 오탐 및 기존 관측 계약을 검토하세요.
        비공개 heldout 자료나 seed·주입 파라미터를 요청하거나 리뷰에 재현하지 마세요.
    - path: "deploy/**"
      instructions: >-
        인증정보 노출, 네트워크 격리, OS별 경로·권한, disabled 기본값과 배포·롤백 안전성을 검토하세요.
    - path: "docker-compose*.yml"
      instructions: >-
        포트 노출·네트워크 분리·소켓 마운트·실행 권한·healthcheck·환경변수 기본값을 검토하세요.
        실제 환경변수나 운영 로그를 출력하지 마세요.
    - path: "**/tests/**"
      instructions: >-
        재현 가능한 경계 조건·실패 경로·회귀를 검토하세요. 기존 testing/run_isolated.py의 외부 IO 차단을 보존하고,
        모의 테스트와 실제 2대 PC E2E 검증을 구분하세요. heldout 내용을 열람하거나 테스트에 복사하지 마세요.
    - path: ".github/**"
      instructions: >-
        최소 토큰 권한, PR 입력의 셸 삽입, 고정 Action SHA, fork 안전성과 필수 체크의 누락을 검토하세요.
        pull_request_target에서 PR head 코드 실행·캐시 복원·비밀정보 노출을 허용하지 마세요.
