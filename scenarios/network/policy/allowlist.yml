# S2/C-a 목적지 Allowlist (P3) — 사람이 사전에 작성하는 정책
#
# 이 파일은 "허용된 데이터 전송 목적지"를 선언한다. 이 정책이 탐지의 기준(ground of
# truth)이며, Loki Ruler용 LogQL 규칙은 이 목록으로부터 생성한다(코드에 목적지를
# 하드코딩하지 않는다).
#
# 판정 규칙:
#   - 목적지(dst_ip, dst_port)가 allow 목록에 있으면        -> 정상 (C-a, 경보 없음)
#   - allow 목록에 없는 목적지로의 데이터 전송이 관측되면    -> 비인가 (S2, 경보)
#
# 핵심 설계 (사용자 계획 §E2/E3):
#   S2와 C-a는 "목적지 허용 여부"만 다르다. 전송량이 크거나 속도가 느리다는 이유만으로
#   공격이라 판단하지 않는다. 따라서 임계값(전송량)은 정상/공격 공통으로 적용되는
#   보조 조건이고, 정상/공격을 가르는 1차 기준은 목적지 정책이다.
#
# 주의 — 아래 IP/포트는 Step 1(Sink 통신 실측)에서 확정한다.
#   현재 값은 leafy-net(10.210.0.0/24, docker-compose.yml) 기준의 기본 배치값이다.
#   Zeek는 backend의 eth0=leafy-net을 관측하므로, 두 Sink가 leafy-net에 있을 때
#   관측이 보장된다. sink-net 분리 배치는 Step 1에서 관측 가능성을 확인한 뒤에만 쓴다.

version: 1

# 허용 목적지. 데이터 전송(backend 출발)이 이 중 하나로 가면 정상으로 본다.
allow:
  - service: sink-a        # C-a 정상 목적지
    ip: 10.210.0.30
    port: 8080
    note: "인가된 백업/연계 목적지 (대조군)"

# 비인가 전송으로 간주하는 전송량 임계값(보조 조건).
# 정상/공격 공통 적용 — 목적지가 허용이면 임계값을 넘겨도 경보하지 않는다.
# 실제 임계값 바이트 수는 Step 3/5(V1 튜닝)에서 확정 후 동결한다.
thresholds:
  min_transfer_bytes: 1048576   # 1MB. 잡음(헬스체크 등) 배제용 하한. 확정값 아님(TODO: V1에서 동결).

# 관측 대상 출발지. 이 서비스가 출발지인 전송만 정책 판정 대상이다.
sources:
  - backend
