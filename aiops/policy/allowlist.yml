# S2/C-a 목적지 Allowlist (P3) — 사람이 작성하는 단일 정책 소스
#
# 이 파일 하나가 탐지의 기준이다. Loki Ruler LogQL 규칙(policy/rulegen.py)과
# LLM용 정책 해석(network_section.py)이 모두 이 파일을 읽어 일관성을 유지한다.
# 코드에 목적지를 하드코딩하지 않는다.
#
# 판정 (per-event: 목적지가 허용되는가):
#   allow 중 하나라도 매칭되면 허용. 아니면 비인가 후보.
#     match: endpoint -> (dst_ip, dst_port) 정확 일치
#     match: service  -> dst_service 라벨 일치 (정상 내부 통신. IP가 동적이라 서비스명으로 허용)
#
# 경보 (aggregate: 비인가 + 임계 초과):
#   비인가 목적지로의 전송 바이트 누적이 thresholds.min_transfer_bytes 를 넘을 때만 경보.
#   => "dst_service=unknown" 이라는 이유만으로는 공격이 아니다. 목적지 정책 + 전송량으로 판단한다.
#   => 전송량/속도가 아니라 "목적지 허용 여부"가 정상(C-a)/공격(S2)을 가른다 (E2/E3).
#
# ⚠ endpoint IP/포트는 Step 1(Sink 실측)에서 확정한다. 현재 값은 leafy-net 기본 배치 기준.
#   배치를 sink-net 으로 바꾸면 여기 IP도 실측 IP로 맞춘다.

version: 1

# 정책 판정 대상 출발지. 이 서비스가 src 인 전송만 본다.
sources:
  - backend

allow:
  # 인가된 전송 목적지 (C-a). ip:port 정확 비교 — 데모의 핵심 판정 기준.
  - service: sink-a
    match: endpoint
    ip: 10.210.0.30
    port: 8080
    note: "인가된 백업/연계 목적지 (대조군 C-a)"

  # 정상 내부 통신 — backend 의 정당한 peer. 서비스명으로 허용해 오탐을 막는다.
  # (컨테이너 IP가 동적이라 ip:port 로 고정할 수 없다)
  - service: db
    match: service
    note: "정상 내부: PostgreSQL"
  - service: minio
    match: service
    note: "정상 내부: 오브젝트 스토리지"
  - service: frontend
    match: service
    note: "정상 내부: 프론트엔드"

thresholds:
  # 비인가 목적지 누적 전송이 이 바이트를 넘으면 경보. 잡음(헬스체크 등) 배제용 하한.
  # 정상/공격 공통 적용 — 인가 목적지는 임계를 넘겨도 경보하지 않는다.
  # ⚠ 확정값 아님: Step 5(V1 튜닝)에서 전송률 R·제한시간 T와 함께 동결한다.
  min_transfer_bytes: 1048576   # 1MB
  # 누적 집계 창(LogQL sum_over_time). 분할된 여러 연결의 전송량을 이 창에서 합산한다.
  window: 5m
