name: Collaboration labels
on:
  issues:
    types: [opened, edited, reopened, closed]
  pull_request_target:
    types: [opened, edited, synchronize, reopened, closed, ready_for_review, converted_to_draft]
permissions:
  contents: read
  issues: write
  pull-requests: write
env:
  PYTHONUTF8: '1'
concurrency:
  group: collaboration-labels-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  collaboration-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Metadata writes use trusted default-branch code only; NEVER execute PR head.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - run: python3 .github/scripts/collaboration_labels.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
