groups:
  - name: aiops-alerts
    rules:

      - alert: HighCpuUsage
        expr: sum(irate(container_cpu_usage_seconds_total{id=~"/docker/.+",cpu="total"}[30s])) > 0.5
        for: 30s
        labels:
          severity: warning
          category: infra
        annotations:
          summary: "컨테이너 CPU 사용률 50% 초과"
          container: "{{ $labels.name }}"

      - alert: HighMemoryUsage
        expr: >
          (container_memory_usage_bytes{id=~"/docker/.+"}
          / container_spec_memory_limit_bytes{id=~"/docker/.+"} > 0.7)
          and container_spec_memory_limit_bytes{id=~"/docker/.+"} > 0
        for: 1m
        labels:
          severity: warning
          category: infra
        annotations:
          summary: "컨테이너 메모리 사용률 70% 초과"
          container: "{{ $labels.name }}"

      - alert: ContainerRestarted
        expr: changes(container_start_time_seconds{id=~"/docker/.+"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
          category: infra
        annotations:
          summary: "컨테이너 재시작 감지"
          container: "{{ $labels.name }}"

      - alert: HighNetworkReceive
        expr: rate(container_network_receive_bytes_total{id=~"/docker/.+"}[1m]) > 1e7
        for: 30s
        labels:
          severity: warning
          category: security
        annotations:
          summary: "네트워크 수신량 급증 (잠재적 DDoS/스캔)"
          container: "{{ $labels.name }}"

      - alert: HighNginxErrorRate
        expr: rate(nginx_http_requests_total[1m]) > 30
        for: 30s
        labels:
          severity: warning
          category: security
        annotations:
          summary: "Nginx 요청량 급증 (잠재적 SQLi/스캔)"
          container: "leafy-frontend"

      - alert: HighPostgresConnections
        expr: pg_stat_activity_count > 40
        for: 30s
        labels:
          severity: warning
          category: security
        annotations:
          summary: "PostgreSQL 동시 연결 수 과다"
          container: "leafy-db"
