groups:
  - name: aiops-alerts
    rules:

      # cAdvisor on Mac ARM (Docker Desktop)에는 name 라벨이 없다.
      # container_name_info (Pipeline /metrics) 의 id→name 매핑을 on(id) 조인으로 붙인다.

      - alert: HighCpuUsage
        expr: >
          sum by (name) (
            irate(container_cpu_usage_seconds_total{id=~"/docker/.+",cpu="total"}[30s])
            * on(id) group_left(name) container_name_info
          )
          > 0.5
        for: 30s
        labels:
          severity: warning
          category: infra
        annotations:
          summary: "컨테이너 CPU 사용률 50% 초과"
          container: "{{ $labels.name }}"

      - alert: HighMemoryUsage
        expr: >
          (
            (
              container_memory_usage_bytes{id=~"/docker/.+"}
              / container_spec_memory_limit_bytes{id=~"/docker/.+"}
            ) * on(id) group_left(name) container_name_info
          ) > 0.7
          and on(id) container_spec_memory_limit_bytes{id=~"/docker/.+"} > 0
        for: 1m
        labels:
          severity: warning
          category: infra
        annotations:
          summary: "컨테이너 메모리 사용률 70% 초과"
          container: "{{ $labels.name }}"

      - alert: ContainerRestarted
        expr: >
          (
            changes(container_start_time_seconds{id=~"/docker/.+"}[5m])
            * on(id) group_left(name) container_name_info
          ) > 0
        for: 0m
        labels:
          severity: critical
          category: infra
        annotations:
          summary: "컨테이너 재시작 감지"
          container: "{{ $labels.name }}"

      # Mac Docker Desktop은 네트워크 메트릭이 per-container가 아닌 id="/" 수준만 제공.
      # id 필터 제거 → Mac(id="/")·Linux/Windows(id="/docker/...") 모두 동작.
      # name 라벨이 없는 환경(Mac)에서는 container 어노테이션이 비어 Pipeline 수동 분석 경로로 진입.
      - alert: HighNetworkReceive
        expr: >
          sum without(interface) (
            rate(container_network_receive_bytes_total{interface!="lo"}[1m])
          ) > 1e7
        for: 30s
        labels:
          severity: warning
          category: security
        annotations:
          summary: "네트워크 수신량 급증 (잠재적 DDoS/스캔)"
          container: "{{ $labels.name }}"

      - alert: HighNginxErrorRate
        expr: rate(nginx_http_requests_total[1m]) > 30
        for: 30s
        labels:
          severity: warning
          category: security
        annotations:
          summary: "Nginx 요청량 급증 (잠재적 SQLi/스캔)"
          container: "leafy-frontend"

      - alert: HighPostgresConnections
        expr: pg_stat_activity_count > 40
        for: 30s
        labels:
          severity: warning
          category: security
        annotations:
          summary: "PostgreSQL 동시 연결 수 과다"
          container: "leafy-db"
