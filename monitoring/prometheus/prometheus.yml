global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "nginx-exporter"
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "pipeline-metadata"
    static_configs:
      - targets: ["pipeline:8000"]
    metrics_path: /metrics

  - job_name: "leafy-backend"          # ← 추가
    static_configs:
      - targets: ["backend:9090"]       # 8080 → 9090 (Actuator 관리 포트 분리)
    metrics_path: /actuator/prometheus  # ← Spring Boot Actuator 경로

  # [F2-a] MinIO 가용성 — up{job="minio"}==0 로 중단 탐지. 호스트 포트 없이 leafy-net/mgmt-net 공유로 도달.
  #        minio 서비스에 MINIO_PROMETHEUS_AUTH_TYPE=public 설정(토큰 불필요).
  - job_name: "minio"
    static_configs:
      - targets: ["minio:9000"]
    metrics_path: /minio/v2/metrics/cluster
