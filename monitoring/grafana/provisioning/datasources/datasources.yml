apiVersion: 1

datasources:
  - name: Prometheus
    uid: PBFA97CFB590B2093
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    uid: P8E80F9AEF21F6940
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true

  # Grafana 내장 Alertmanager 데이터소스는 서버 측 health check가 없다. 그래서 UI의 "Save & test"
  # (/api/datasources/uid/leafy-alertmanager/health)는 항상 "Plugin unavailable"(500)을 보여 주지만 플러그인 누락이 아니다 (#63).
  # 실제 조회는 정상이다. 확인: /api/alertmanager/leafy-alertmanager/api/v2/status 가 200 (Grafana 13.3 실측).
  # 대시보드 Alertmanager 패널은 아래 "Alertmanager API"(Infinity, health check 지원)를 쓴다.
  - name: Alertmanager
    uid: leafy-alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    isDefault: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false

  # Backend-only REST queries; the built-in Alertmanager source remains unchanged.
  - name: Alertmanager API
    uid: leafy-alertmanager-api
    type: yesoreyeram-infinity-datasource
    access: proxy
    isDefault: false
    jsonData:
      auth_method: none
      allowedHosts:
        - http://alertmanager:9093
