# ⚠ 자동 생성 파일 — 손으로 고치지 말 것.
# 정책 변경은 aiops/policy/allowlist.yml 을 고친 뒤 재생성한다:
#   cd aiops/pipeline && python -m policy.rulegen ../policy/allowlist.yml ../../monitoring/loki/rules/fake/network-allowlist.yml
groups:
- name: network-allowlist-alerts
  rules:
  - alert: UnauthorizedDataTransfer
    expr: |-
      sum by (dst_ip, dst_port) (
        sum_over_time(
          {log_type="network", event_type="connection", src_service="backend", dst_service!~"db|minio|frontend"} | json | __error__="" | (dst_ip!="10.210.0.30" or dst_port!=8080) | bytes_sent!="" | unwrap bytes_sent [5m]
        )
      ) > 1048576
    for: 0m
    labels:
      severity: critical
      category: security
      detection: cumulative
    annotations:
      container: leafy-backend
      summary: 비인가 목적지로의 대용량 데이터 전송 탐지
      description: backend 가 Allowlist 에 없는 목적지로 임계 초과 전송 (dst {{ $labels.dst_ip }}:{{
        $labels.dst_port }}, 누적 {{ $value }} bytes)
  - alert: UnauthorizedTransferEarly
    expr: |-
      sum by (dst_ip, dst_port) (
        count_over_time(
          {log_type="network", event_type="connection_threshold", src_service="backend", dst_service!~"db|minio|frontend"} | json | __error__="" | (dst_ip!="10.210.0.30" or dst_port!=8080) [5m]
        )
      ) > 0
    for: 0m
    labels:
      severity: critical
      category: security
      detection: early
    annotations:
      container: leafy-backend
      summary: 비인가 목적지로의 전송 중 조기 탐지 (연결 종료 전)
      description: backend 의 단일 연결이 Allowlist 에 없는 목적지로 바이트 임계값을 초과함 (dst {{ $labels.dst_ip
        }}:{{ $labels.dst_port }})
