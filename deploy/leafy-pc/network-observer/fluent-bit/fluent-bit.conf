# 팀원 PC: Network Observer가 쓴 Canonical Network Event(JSONL) -> AIOps PC Fluentd 24224 (tag network.event)
#
# 중앙 Fluentd는 tag network.event를 concat/앱 로그 변환 없이 기존 @NETWORK 경로로 보낸다.
# 레코드는 canonical event 그대로이고 시각은 event의 timestamp(connection 시작, UTC)다.
#
# 신뢰성
#   - DB: 읽은 위치를 기록한다. shipper가 재시작돼도 이어서 읽는다.
#   - storage.type filesystem: AIOps PC가 꺼져 있거나 Tailscale이 끊긴 동안 디스크에 쌓았다가 재연결 후 보낸다.
#   - scheduler.cap 60: 재시도 간격 상한. 기본 2000초면 오래 끊겼다 복구된 뒤 전송이 최대 33분 늦어진다.

[SERVICE]
    Flush                     1
    Log_Level                 info
    Parsers_File              parsers.conf
    scheduler.cap             60
    storage.path              /fluent-bit/state/storage
    storage.sync              normal
    storage.backlog.mem_limit 16M

[INPUT]
    Name              tail
    Tag               network.event
    Path              /var/log/network-observer/network-events.jsonl
    Parser            canonical_network_event
    DB                /fluent-bit/state/network-events.db
    Read_from_Head    On
    Refresh_Interval  5
    Buffer_Chunk_Size 64k
    Buffer_Max_Size   1M
    Skip_Long_Lines   On
    Mem_Buf_Limit     16M
    storage.type      filesystem

#   - Require_Ack_Response: Fluentd가 받았다고 응답해야 버퍼에서 지운다 (at-least-once).
#     없으면 TCP 쓰기만 성공해도 보낸 것으로 처리해, 수신 측 오류 시 조용히 유실된다.
#   - Retain_Metadata_In_Forward_Mode Off: Fluent Bit 2.1+ 기본 형식 [[time, metadata], record]는
#     중앙 Fluentd 1.16 in_forward가 해석하지 못한다 (NoMethodError, 실측). [time, record]로 보낸다.
[OUTPUT]
    Name                            forward
    Match                           network.event
    Host                            ${AIOPS_TAILSCALE_IP}
    Port                            24224
    Require_Ack_Response            On
    Retain_Metadata_In_Forward_Mode Off
    Retry_Limit                     no_limits
    storage.total_limit_size        512M
