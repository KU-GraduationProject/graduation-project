# Canonical Network Event v1.0 (docs/network-observability/NETWORK_EVENT_SCHEMA.md)
# timestamp = "2026-10-04T05:08:14.969Z" (UTC, ms). Time_Keep On: body에서 timestamp를 지우지 않는다.
[PARSER]
    Name        canonical_network_event
    Format      json
    Time_Key    timestamp
    Time_Format %Y-%m-%dT%H:%M:%S.%LZ
    Time_Keep   On
