# 팀원 PC (Windows 11): PostgreSQL 17 jsonlog -> Tailscale -> AIOps PC Fluentd 24225
#
# 설치/실행 절차는 deploy/leafy-pc/README.md 참고. 경로는 PostgreSQL 기본 설치 기준이므로 실제 data 디렉터리로 바꾼다.
# 환경변수(시스템 변수로 등록, 값은 커밋하지 않는다):
#   AIOPS_TAILSCALE_IP     AIOps PC의 Tailscale IPv4 (tailscale ip -4)
#   FLUENTD_PG_SHARED_KEY  AIOps PC .env의 FLUENTD_PG_SHARED_KEY와 같은 값
#
# 시각: 여기서는 jsonlog의 timestamp를 해석하지 않는다 ("... KST" 약어는 Fluent Bit strptime으로 신뢰성 있게 못 읽는다).
#       중앙 Fluentd(leafy_postgres_log)가 timestamp로 Loki 시각을 정한다. 원본 필드는 손대지 않는다.

# scheduler.cap 60: 재시도 간격 상한. 기본 2000초면 오래 끊겼다 복구된 뒤 전송이 최대 33분 늦어진다.
[SERVICE]
    Flush                     1
    Log_Level                 info
    Parsers_File              parsers.conf
    scheduler.cap             60
    storage.path              C:\fluent-bit\state\storage\
    storage.sync              normal
    storage.backlog.mem_limit 16M

# 로테이션: PostgreSQL은 새 파일을 만들며 로테이션한다 (log_filename에 날짜·시각 포함, 덮어쓰기 없음).
#   *.json 패턴으로 새 파일을 Refresh_Interval마다 찾고, DB에 파일별 읽은 위치를 남긴다.
#   Read_from_Head Off: 처음 설치할 때 쌓여 있던 과거 로그를 한꺼번에 보내지 않는다. 이후 새로 생기는 파일은 처음부터 읽는다.
# 긴 줄: 기본 Buffer_Max_Size(32k)를 넘는 줄(긴 SQL statement 등)이 있으면 그 파일 추적이 멈춘다.
#   1M까지 받고, 그보다 긴 줄은 건너뛴다 (Skip_Long_Lines). 건너뛴 줄은 Fluent Bit 로그에 경고로 남는다.
[INPUT]
    Name              tail
    Tag               postgresql.jsonlog
    Path              C:\Program Files\PostgreSQL\17\data\log\*.json
    Parser            pg_jsonlog
    Path_Key          pg_log_file
    DB                C:\fluent-bit\state\pg-jsonlog.db
    Read_from_Head    Off
    Refresh_Interval  10
    Rotate_Wait       30
    Buffer_Chunk_Size 64k
    Buffer_Max_Size   1M
    Skip_Long_Lines   On
    Mem_Buf_Limit     16M
    storage.type      filesystem

# 재연결/버퍼링: AIOps PC가 꺼져 있거나 Tailscale이 끊기면 storage.path에 쌓았다가 재연결 후 보낸다 (최대 1G).
#   Require_Ack_Response: 중앙 Fluentd가 받았다고 응답해야 버퍼에서 지운다 (at-least-once).
#   Retain_Metadata_In_Forward_Mode Off: 중앙 Fluentd 1.16이 Fluent Bit 2.1+ 기본 이벤트 형식을 해석하지 못한다.
#   Shared_Key: 24225는 shared_key 핸드셰이크를 요구한다. 값이 다르면 연결이 거부된다.
[OUTPUT]
    Name                            forward
    Match                           postgresql.*
    Host                            ${AIOPS_TAILSCALE_IP}
    Port                            24225
    Shared_Key                      ${FLUENTD_PG_SHARED_KEY}
    Self_Hostname                   leafy-pc
    Require_Ack_Response            On
    Retain_Metadata_In_Forward_Mode Off
    Retry_Limit                     no_limits
    storage.total_limit_size        1G
