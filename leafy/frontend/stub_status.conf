# nginx-exporter 전용 stub_status (HighNginxRequestRate 의 입력 nginx_http_requests_total)
#
# frontend 이미지의 conf.d/default.conf(80 서버 블록)는 바꾸지 않고, 이 파일을 conf.d 에 마운트해 서버 블록만 더한다.
# - 호스트 포트로 공개하지 않는다: docker-compose.yml frontend.ports 에 8081 이 없다
# - compose 내부 leafy-net(10.210.0.0/24, docker-compose.yml networks.leafy-net)에서만 허용, 나머지는 403
#   nginx-exporter 는 leafy-net 으로 http://frontend:8081/stub_status 를 긁는다
# - 5초마다 긁히므로 액세스 로그를 남기지 않는다. Loki 의 frontend 액세스 로그(VulnerabilityScanningDetected 등)에 섞이지 않게
server {
    listen 8081;
    server_name _;
    access_log off;

    location = /stub_status {
        stub_status;
        allow 10.210.0.0/24;
        deny all;
    }

    # 기본 root(정적 파일)를 8081 로 내주지 않는다
    location / {
        return 404;
    }
}
