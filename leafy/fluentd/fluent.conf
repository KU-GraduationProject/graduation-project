<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

# Docker 메타데이터 제거, 실제 로그 메시지만 추출
<filter **>
  @type record_transformer
  enable_ruby true
  remove_keys log,container_id,container_name
  <record>
    container ${tag}
    message   ${(record["log"] || "").strip}
    source    ${record["source"] || "stdout"}
  </record>
</filter>

<match **>
  @type loki
  url http://loki:3100
  line_format key_value
  <label>
    container $.container
    source    $.source
  </label>
  <buffer>
    flush_interval 5s
    flush_at_shutdown true
  </buffer>
</match>
