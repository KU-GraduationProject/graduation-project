<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<filter **>
  @type record_transformer
  <record>
    container ${tag}
  </record>
</filter>

<match **>
  @type loki
  url http://loki:3100
  <label>
    container $.container
    tag ${tag}
  </label>
  <buffer>
    flush_interval 5s
    flush_at_shutdown true
  </buffer>
</match>
