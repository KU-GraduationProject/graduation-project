<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

# ─────────────────────────────────────────────
# Network Event 수집 (#8)
# Network Observer(#5)가 쓰는 Canonical Network Event v1.0 JSONL을 tail 한다.
# @label @NETWORK 로 라우팅하므로 아래 Application Log용 <filter **> / <match **>를
# 전혀 거치지 않는다. (legacy container label이 붙거나 line이 바뀌는 일이 없다)
# ─────────────────────────────────────────────
<source>
  @type tail
  @label @NETWORK
  tag network.event
  path /var/log/network-observer/network-events.jsonl
  pos_file /fluentd/log/network-events.pos
  read_from_head true
  <parse>
    @type json
    # Loki entry 시각 = connection 시작 시각 (NETWORK_EVENT_SCHEMA.md §6.1)
    time_key timestamp
    time_type string
    time_format %Y-%m-%dT%H:%M:%S.%L%z
    # body는 canonical event 그대로 보존해야 하므로 timestamp를 지우지 않는다
    keep_time_key true
  </parse>
</source>

# Docker 메타데이터 제거, 실제 로그 메시지만 추출
#
# Identity (#6, docs/network-observability/NETWORK_EVENT_SCHEMA.md §4):
#   service        [canonical] 논리 서비스. Compose가 붙이는 com.docker.compose.service 라벨에서 얻는다.
#   container_name [canonical] 실제 컨테이너 이름. Docker driver가 주는 "/leafy-backend"에서 "/"를 뗀다.
#                              container가 없는 runtime이면 nil -> Loki label이 생기지 않는다.
#   runtime        [canonical] container_id가 있으면 container, 없으면 unknown.
#   container      [LEGACY]    Fluentd tag 그대로. 값이 frontend/backend/leafy-db로 섞여 있다.
#                              Pipeline의 기존 {container="..."} 조회를 깨지 않기 위해 유지한다. 신규 조회에 쓰지 말 것.
#
# 위 키들은 모두 Loki label이므로 loki 플러그인이 line에서 제거한다.
# 따라서 log line 내용(message=...)은 변경 전과 동일하다. Pipeline이 line을 LLM에 그대로 넘기므로 중요하다.
# com.docker.compose.service는 label이 아니므로 remove_keys로 지워야 line에 새어 나가지 않는다.
<filter **>
  @type record_transformer
  enable_ruby true
  remove_keys log,container_id,com.docker.compose.service
  <record>
    container      ${tag}
    message        ${(record["log"] || "").strip}
    source         ${record["source"] || "stdout"}
    service        ${record["com.docker.compose.service"] || "unknown"}
    container_name ${record["container_name"] ? record["container_name"].sub(/\A\//, "") : nil}
    runtime        ${record["container_id"] ? "container" : "unknown"}
  </record>
</filter>

<match **>
  @type loki
  url http://loki:3100
  line_format key_value
  <label>
    container      $.container
    source         $.source
    service        $.service
    container_name $.container_name
    runtime        $.runtime
  </label>
  <buffer>
    flush_interval 5s
    flush_at_shutdown true
  </buffer>
</match>

# ─────────────────────────────────────────────
# Network Event → Loki (#8)
# Loki label: NETWORK_EVENT_SCHEMA.md §10.2의 6개만 사용한다.
#   log_type, event_type, src_service, dst_service, protocol, network
# IP / port / container / connection_id / interface 등은 label로 만들지 않는다 (§10.3).
# ─────────────────────────────────────────────
<label @NETWORK>
  # loki 플러그인은 label 값을 읽어온 record 키를 line에서 삭제한다.
  # 원본 필드를 label 소스로 쓰면 body에서 src_service 등이 사라지므로,
  # 임시 사본(_lbl_*)을 label 소스로 쓰고 원본은 body에 그대로 남긴다. (§10.4: body는 event 자체로 완결)
  <filter network.event>
    @type record_transformer
    <record>
      _lbl_event_type  ${record["event_type"]}
      _lbl_src_service ${record["src_service"]}
      _lbl_dst_service ${record["dst_service"]}
      _lbl_protocol    ${record["protocol"]}
      _lbl_network     ${record["network"]}
    </record>
  </filter>

  <match network.event>
    @type loki
    url http://loki:3100
    # body = Canonical Network Event JSON 한 줄. LogQL `| json`으로 파싱한다.
    line_format json
    extra_labels {"log_type":"network"}
    <label>
      event_type  $._lbl_event_type
      src_service $._lbl_src_service
      dst_service $._lbl_dst_service
      protocol    $._lbl_protocol
      network     $._lbl_network
    </label>
    <buffer>
      flush_interval 5s
      flush_at_shutdown true
    </buffer>
  </match>
</label>
