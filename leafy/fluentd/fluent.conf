# ─────────────────────────────────────────────
# 수신 포트 — 두 로그 수집 포트는 분리한다 (docs/remote/REMOTE_DEPLOYMENT.md)
#   24224/TCP : Docker fluentd log driver (Leafy frontend/backend/minio)
#               + 팀원 PC network-events shipper (tag network.event)       -> @DOCKER
#   24225/TCP : Windows PostgreSQL 17 jsonlog (Fluent Bit, shared_key 인증) -> @POSTGRES
# concat(partial 재조립)은 @DOCKER의 앱 로그에만 적용된다. Network Event와 PostgreSQL은 거치지 않는다.
# ─────────────────────────────────────────────
<source>
  @type forward
  @label @DOCKER
  port 24224
  bind 0.0.0.0
</source>

# Docker log driver는 shared_key 핸드셰이크를 지원하지 않아 24224에는 인증을 걸 수 없다.
# Fluent Bit은 지원하므로 24225는 shared_key로 송신자를 제한한다. (Tailscale ACL과 별개의 앱 계층 통제)
<source>
  @type forward
  @label @POSTGRES
  port 24225
  bind 0.0.0.0
  <security>
    self_hostname aiops-fluentd
    shared_key "#{ENV['FLUENTD_PG_SHARED_KEY']}"
  </security>
</source>

# ─────────────────────────────────────────────
# Network Event 수집 (#8)
# Network Observer(#5)가 쓰는 Canonical Network Event v1.0 JSONL을 tail 한다.
# @label @NETWORK 로 라우팅하므로 아래 Application Log용 <filter **> / <match **>를
# 전혀 거치지 않는다. (legacy container label이 붙거나 line이 바뀌는 일이 없다)
# ─────────────────────────────────────────────
<source>
  @type tail
  @label @NETWORK
  tag network.event
  path /var/log/network-observer/network-events.jsonl
  pos_file /fluentd/log/network-events.pos
  read_from_head true
  <parse>
    @type json
    # Loki entry 시각 = connection 시작 시각 (NETWORK_EVENT_SCHEMA.md §6.1)
    time_key timestamp
    time_type string
    time_format %Y-%m-%dT%H:%M:%S.%L%z
    # body는 canonical event 그대로 보존해야 하므로 timestamp를 지우지 않는다
    keep_time_key true
  </parse>
</source>

# ─────────────────────────────────────────────
# 24224: Docker 로그 (+ 원격 Network Event)
# ─────────────────────────────────────────────
<label @DOCKER>
  # 원격 배포: 팀원 PC의 Fluent Bit이 network-events.jsonl을 tail 해 canonical event 레코드 그대로 보낸다.
  # (시각 = event의 timestamp). 위 tail source와 같은 레코드이므로 같은 @NETWORK 경로로 보낸다.
  # 이 match가 아래 concat보다 앞에 있어야 network event가 concat/앱 로그 변환을 거치지 않는다.
  <match network.event>
    @type relabel
    @label @NETWORK
  </match>

  # Docker는 16KB를 넘는 한 줄을 partial_message/partial_id/partial_ordinal/partial_last가 붙은
  # 여러 레코드로 나눠 보낸다. partial_id별로 모아 partial_ordinal 순으로 이어 붙인다.
  #   - partial 메타데이터가 없는 레코드(짧은 로그)는 그대로 통과한다.
  #   - 마지막 조각이 flush_interval 안에 오지 않으면 모인 만큼 @DOCKER_APP으로 내보낸다.
  #     이 레코드에는 partial_* 키가 남아 있어 leafy_docker_log가 log_partial_incomplete로 표시한다.
  #   - 시각은 첫 조각의 시각 (로그가 쓰이기 시작한 시점)
  <filter **>
    @type concat
    key log
    use_partial_metadata true
    separator ""
    use_first_timestamp true
    flush_interval 10
    timeout_label @DOCKER_APP
  </filter>

  <match **>
    @type relabel
    @label @DOCKER_APP
  </match>
</label>

# Application Log -> Loki
#   line : JSON 로그면 앱 JSON 필드 그대로 + "docker"(container_id 등 driver 메타데이터)
#          JSON이 아니면 {"message": 원문, "docker": ...}  (기존 key_value의 message와 같은 이름)
#   label: container(LEGACY), source, service, container_name, runtime, log_format
#          request_id / IP / 사용자 ID 같은 고유값은 label로 만들지 않고 line에만 둔다.
# 변환 규칙과 identity 정의는 plugins/filter_leafy_docker_log.rb 참고.
<label @DOCKER_APP>
  <filter **>
    @type leafy_docker_log
    # Loki max_line_size(256KB, loki-config 기본값)를 넘으면 Loki가 400으로 거부하고 out_loki는 재시도 없이 버린다.
    # 그보다 작게 맞춘다: 큰 필드(stack_trace 등)만 머리·꼬리·Caused by를 남기고 log_truncated를 붙인다 (plugins/leafy_log_size.rb)
    max_line_bytes 240k
  </filter>

  <match **>
    @type loki
    url http://loki:3100
    line_format json
    <label>
      container      $._lbl_container
      source         $._lbl_source
      service        $._lbl_service
      container_name $._lbl_container_name
      runtime        $._lbl_runtime
      log_format     $._lbl_log_format
    </label>
    <buffer>
      @type file
      path /fluentd/log/buffer/app
      flush_interval 5s
      flush_at_shutdown true
    </buffer>
  </match>
</label>

# ─────────────────────────────────────────────
# 24225: Windows PostgreSQL 17 -> Loki
#   service=db, runtime=host 로 식별한다. 기존 컨테이너 DB 로그(runtime=container, container_name=leafy-db)와
#   {service="db"}로 함께 조회되지만 runtime label로 구분된다. container 계열 label은 붙이지 않는다.
#   line : PostgreSQL jsonlog 필드 그대로. entry 시각 = jsonlog의 timestamp
# ─────────────────────────────────────────────
<label @POSTGRES>
  <filter **>
    @type leafy_postgres_log
    service db
    runtime host
    max_line_bytes 240k
  </filter>

  <match **>
    @type loki
    url http://loki:3100
    line_format json
    <label>
      service    $._lbl_service
      runtime    $._lbl_runtime
      log_format $._lbl_log_format
    </label>
    <buffer>
      @type file
      path /fluentd/log/buffer/postgres
      flush_interval 5s
      flush_at_shutdown true
    </buffer>
  </match>
</label>

# ─────────────────────────────────────────────
# Network Event → Loki (#8)
# Loki label: NETWORK_EVENT_SCHEMA.md §10.2의 6개만 사용한다.
#   log_type, event_type, src_service, dst_service, protocol, network
# IP / port / container / connection_id / interface 등은 label로 만들지 않는다 (§10.3).
# ─────────────────────────────────────────────
<label @NETWORK>
  # loki 플러그인은 label 값을 읽어온 record 키를 line에서 삭제한다.
  # 원본 필드를 label 소스로 쓰면 body에서 src_service 등이 사라지므로,
  # 임시 사본(_lbl_*)을 label 소스로 쓰고 원본은 body에 그대로 남긴다. (§10.4: body는 event 자체로 완결)
  <filter network.event>
    @type record_transformer
    <record>
      _lbl_event_type  ${record["event_type"]}
      _lbl_src_service ${record["src_service"]}
      _lbl_dst_service ${record["dst_service"]}
      _lbl_protocol    ${record["protocol"]}
      _lbl_network     ${record["network"]}
    </record>
  </filter>

  <match network.event>
    @type loki
    url http://loki:3100
    # body = Canonical Network Event JSON 한 줄. LogQL `| json`으로 파싱한다.
    line_format json
    extra_labels {"log_type":"network"}
    <label>
      event_type  $._lbl_event_type
      src_service $._lbl_src_service
      dst_service $._lbl_dst_service
      protocol    $._lbl_protocol
      network     $._lbl_network
    </label>
    <buffer>
      flush_interval 5s
      flush_at_shutdown true
    </buffer>
  </match>
</label>

# Fluentd 자신의 경고·오류. out_loki는 Loki 4xx(예: 7일보다 오래된 시각, 줄 길이 초과)를 재시도 없이 버리고
# "failed to write post to …" 경고만 남긴다. 이 경고를 Loki에 남겨 유실이 조용히 지나가지 않게 한다.
#   조회: {log_type="fluentd_internal"} |= "failed to write post"
# Loki가 내려가 있는 동안 쌓이는 재시도 경고가 메모리를 키우지 않도록 8MB를 넘으면 오래된 것부터 버린다.
<label @FLUENT_LOG>
  <match fluent.{warn,error,fatal}>
    @type loki
    url http://loki:3100
    line_format json
    extra_labels {"log_type":"fluentd_internal"}
    <buffer>
      @type memory
      flush_interval 5s
      total_limit_size 8m
      overflow_action drop_oldest_chunk
    </buffer>
  </match>
  # info 이하는 컨테이너 stdout에만 둔다 (match가 없으면 기동 시 경고가 난다)
  <match fluent.**>
    @type null
  </match>
</label>

# 필터 예외 등으로 정상 경로를 벗어난 레코드. 버리지 않고 별도 stream에 남긴다.
<label @ERROR>
  <match **>
    @type loki
    url http://loki:3100
    line_format json
    extra_labels {"log_type":"fluentd_error"}
    <buffer>
      flush_interval 5s
      flush_at_shutdown true
    </buffer>
  </match>
</label>
