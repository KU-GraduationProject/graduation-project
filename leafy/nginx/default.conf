server {
    listen 80;
    server_name leafy-pr.com;

    location /stub_status {
        stub_status on;
        allow 127.0.0.1;
        allow 172.0.0.0/8;
        deny all;
    }

    # HTTP로 들어오면 HTTPS로 강제 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name leafy-pr.com;

    # SSL 인증서 경로 (나중에 도커 볼륨으로 연결됨)
    ssl_certificate /etc/letsencrypt/live/leafy-pr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leafy-pr.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # 1. 프론트엔드 (화면)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. 백엔드 API 프록시 (이제 브라우저는 8080포트로 직접 안 감!)
    location /api/ {
        proxy_pass http://backend:8080; # 도커 내부망으로 연결
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. 로그인/OAuth 관련 프록시
    location /login/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /oauth2/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
