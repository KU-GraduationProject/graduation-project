tle><rect x="450" y="480" width="270" height="140" rx="12" fill="#ffe6cc" stroke="#d79b00" stroke-width="2"/><text x="585.0" y="524.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="17" font-weight="600" fill="#263343">Fluentd :24224 TCP/UDP</text><text x="585.0" y="550.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">앱 forward + 네트워크 파일 tail</text><text x="585.0" y="576.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">별도 경로로 Loki에 적재</text></g><g data-cell-id="loki"><title>loki — docker-compose.yml:293</title><rect x="830" y="480" width="270" height="140" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><path d="M830,498 Q965.0,524 1100,498" fill="none" stroke="#82b366"/><text x="965.0" y="524.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="17" font-weight="600" fill="#263343">Loki :3100</text><text x="965.0" y="550.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">앱·네트워크·분석 로그 저장</text><text x="965.0" y="576.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">로그 패턴 규칙 / Ruler</text></g><g data-cell-id="pipeline"><title>pipeline — docker-compose.yml:343</title><rect x="1220" y="480" width="300" height="140" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="1370.0" y="524.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="17" font-weight="600" fill="#263343">AIOps Pipeline :8000</text><text x="1370.0" y="550.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">Alert → 컨텍스트 상관 → RCA</text><text x="1370.0" y="576.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">Prometheus·Loki 조회 / 결과 기록</text></g><g data-cell-id="grafana"><title>grafana — docker-compose.yml:306</title><rect x="450" y="790" width="270" height="140" rx="12" fill="#f5f5f5" stroke="#666666" stroke-width="2"/><text x="585.0" y="834.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="17" font-weight="600" fill="#263343">Grafana :3000</text><text x="585.0" y="860.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">Prometheus + Loki 조회</text><text x="585.0" y="886.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">메트릭·로그·RCA 타임라인</text></g><g data-cell-id="ollama"><title>ollama — docker-compose.yml:328</title><rect x="830" y="790" width="270" height="140" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="965.0" y="834.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="17" font-weight="600" fill="#263343">Ollama :11434</text><text x="965.0" y="860.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">llama3.2:3b / 로컬 추론</text><text x="965.0" y="886.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">GPU override 선택</text></g><g data-cell-id="remediation"><title>remediation — docker-compose.yml:368</title><rect x="1220" y="790" width="300" height="140" rx="12" fill="#f8cecc" stroke="#b85450" stroke-width="2" stroke-dasharray="7 5"/><text x="1370.0" y="834.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="17" font-weight="600" fill="#263343">Remediation :8001</text><text x="1370.0" y="860.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">현재 중지 유지</text><text x="1370.0" y="886.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">기동 시에만 Docker 조치·Slack 연계</text></g><text x="60" y="62" font-family="Malgun Gothic,sans-serif" font-size="28" font-weight="700" fill="#263343">Leafy AIOps | 전체 아키텍처</text><text x="60" y="99" font-family="Malgun Gothic,sans-serif" font-size="15" font-weight="400" fill="#263343">Compose 선언 + 현재 코드 기준의 핵심 경로이다. 실행 상태는 조회하지 않았으며, Remediation 중지는 사용자 제공 상태이다.</text><text x="80" y="397" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">backend eth0 캡처</text><text x="440" y="367" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">Docker 데몬 localhost:24224</text><text x="730" y="217" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">메트릭 응답</text><text x="1110" y="217" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">Alert 전송</text><text x="365" y="517" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">이벤트</text><text x="365" y="537" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">JSONL</text><text x="735" y="517" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">로그 적재</text><text x="1110" y="517" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">컨텍스트</text><text x="1110" y="537" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">조회</text><text x="1400" y="372" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">/webhook/alert</text><text x="990" y="362" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">Ruler Alert</text><text x="1040" y="652" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">POST /api/chat</text><text x="1310" y="652" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">/action 시도</text><text x="1310" y="672" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">중지 중 실패</text><text x="700" y="677" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">조회</text><text x="60" y="1018" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">파란색: 앱·분석 / 주황색: 수집 / 초록색: 저장 / 보라색: 네트워크·LLM / 빨간 점선: 중지된 대응 경로이다.</text><text x="60" y="1039" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">전체 컨테이너 연결과 양방향 요청·응답은 가독성을 위해 요약하며, 상세 흐름은 다음 페이지에 표시한다.</text></svg>