erif" font-size="14" font-weight="400" fill="#263343">앱: forward → key_value</text><text x="585.0" y="576.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">네트워크: @NETWORK → JSON</text></g><g data-cell-id="loki"><title>loki — docker-compose.yml:293</title><rect x="830" y="480" width="270" height="140" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><path d="M830,498 Q965.0,524 1100,498" fill="none" stroke="#82b366"/><text x="965.0" y="511.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="17" font-weight="600" fill="#263343">Loki</text><text x="965.0" y="537.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">앱: service / container_name</text><text x="965.0" y="563.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">네트워크: src_service /</text><text x="965.0" y="589.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">dst_service</text></g><g data-cell-id="pipeline"><title>pipeline — docker-compose.yml:343</title><rect x="1220" y="480" width="300" height="140" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="1370.0" y="524.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="17" font-weight="600" fill="#263343">Pipeline 컨텍스트 조회</text><text x="1370.0" y="550.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">앱: {service=…}</text><text x="1370.0" y="576.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">네트워크: src/dst 2개 selector</text></g><g data-cell-id="network-observer-zeek"><title>network-observer-zeek — docker-compose.yml:391</title><rect x="60" y="790" width="300" height="140" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="210.0" y="834.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="17" font-weight="600" fill="#263343">Zeek</text><text x="210.0" y="860.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">network_mode: service:backend</text><text x="210.0" y="886.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">zeek -C -i eth0</text></g><g data-cell-id="vol:zeek_logs"><title>vol:zeek_logs — docker-compose.yml:31</title><rect x="450" y="790" width="270" height="140" rx="12" fill="#f5f5f5" stroke="#666666" stroke-width="2"/><path d="M450,808 Q585.0,834 720,808" fill="none" stroke="#666666"/><text x="585.0" y="834.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="17" font-weight="600" fill="#263343">zeek_logs 볼륨</text><text x="585.0" y="860.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">conn.log / JSON Lines</text><text x="585.0" y="886.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">Enricher가 읽기 전용 tail</text></g><g data-cell-id="network-observer-enricher"><title>network-observer-enricher — docker-compose.yml:416</title><rect x="830" y="790" width="270" height="140" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="965.0" y="821.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="17" font-weight="600" fill="#263343">Enricher</text><text x="965.0" y="847.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">Docker metadata → endpoint</text><text x="965.0" y="873.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">identity</text><text x="965.0" y="899.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">Canonical Network Event v1.0</text></g><g data-cell-id="vol:network_events"><title>vol:network_events — docker-compose.yml:32</title><rect x="1220" y="790" width="300" height="140" rx="12" fill="#f5f5f5" stroke="#666666" stroke-width="2"/><path d="M1220,808 Q1370.0,834 1520,808" fill="none" stroke="#666666"/><text x="1370.0" y="834.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="17" font-weight="600" fill="#263343">network_events 볼륨</text><text x="1370.0" y="860.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">network-events.jsonl</text><text x="1370.0" y="886.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">Fluentd가 읽기 전용 tail</text></g><text x="60" y="62" font-family="Malgun Gothic,sans-serif" font-size="28" font-weight="700" fill="#263343">관측 데이터 | Application Logs + Network Events</text><text x="60" y="99" font-family="Malgun Gothic,sans-serif" font-size="15" font-weight="400" fill="#263343">서비스 이름은 Compose identity이다. 실선은 데이터 전달, 보라색 선은 네트워크 관측과 정규화 경로이다.</text><text x="350" y="217" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">HTTP</text><text x="730" y="217" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">JDBC</text><text x="940" y="347" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">Object API</text><text x="365" y="517" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">forward</text><text x="365" y="537" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">:24224</text><text x="735" y="517" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">5초 flush</text><text x="1110" y="517" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">동일 service</text><text x="1110" y="537" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">같은 시간창</text><text x="60" y="387" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">네임스페이스 공유 / eth0만 관측</text><text x="360" y="827" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">연결 로그</text><text x="745" y="827" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">tail</text><text x="1100" y="827" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">정규화 JSONL</text><text x="760" y="672" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">별도 @NETWORK 경로 / 원본 JSON 보존</text><text x="60" y="1018" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">leafy-net: 10.210.0.0/24 / Zeek는 독립 네트워크 없이 backend 네임스페이스를 공유한다.</text><text x="60" y="1039" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">네트워크 이벤트는 보조 컨텍스트이다. 연결 종료 지연·관측 누락이 가능하며, 빈 결과를 정상으로 단정하지 않는다.</text></svg>