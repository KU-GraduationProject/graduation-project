211.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="17" font-weight="600" fill="#263343">Prometheus 규칙</text><text x="210.0" y="237.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">메트릭 임계값 Alert 6종</text><text x="210.0" y="263.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">exporter 4종 + backend + Pipeline</text><text x="210.0" y="289.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">수집</text></g><g data-cell-id="loki"><title>loki — docker-compose.yml:293</title><rect x="60" y="480" width="300" height="140" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="210.0" y="524.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="17" font-weight="600" fill="#263343">Loki Ruler</text><text x="210.0" y="550.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">보안·로그 패턴 Alert 9종</text><text x="210.0" y="576.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">애플리케이션 로그 기준</text></g><g data-cell-id="alertmanager"><title>alertmanager — docker-compose.yml:280</title><rect x="450" y="180" width="270" height="140" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="585.0" y="224.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="17" font-weight="600" fill="#263343">Alertmanager</text><text x="585.0" y="250.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">모든 Alert → 단일 webhook</text><text x="585.0" y="276.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">group 10초 / repeat 240초</text></g><g data-cell-id="pipeline"><title>pipeline — docker-compose.yml:343</title><rect x="830" y="180" width="270" height="140" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="965.0" y="224.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="17" font-weight="600" fill="#263343">Pipeline /webhook/alert</text><text x="965.0" y="250.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">firing만 처리 · 300초 중복 제거</text><text x="965.0" y="276.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">대상 컨테이너와 service 해석</text></g><g data-cell-id="correlation"><title>correlation — aiops/pipeline/main.py:271</title><rect x="1220" y="180" width="300" height="140" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/><text x="1370.0" y="224.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="17" font-weight="600" fill="#263343">Pipeline: 컨텍스트 수집</text><text x="1370.0" y="250.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">startsAt ±5분 조회</text><text x="1370.0" y="276.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">메트릭 + 앱 로그 + 네트워크</text></g><g data-cell-id="ollama"><title>ollama — docker-compose.yml:328</title><rect x="1220" y="480" width="300" height="140" rx="12" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="1370.0" y="524.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="17" font-weight="600" fill="#263343">Ollama /api/chat</text><text x="1370.0" y="550.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">llama3.2:3b · JSON 응답</text><text x="1370.0" y="576.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">동시 1 · 요청 타임아웃 180초</text></g><g data-cell-id="analysis-store"><title>analysis-store — aiops/pipeline/main.py:271</title><rect x="830" y="480" width="270" height="140" rx="12" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="965.0" y="511.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="17" font-weight="600" fill="#263343">Pipeline: 분석 결과 기록</text><text x="965.0" y="537.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">Loki aiops-llm /</text><text x="965.0" y="563.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">aiops-timeline</text><text x="965.0" y="589.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">근본 원인 · 증거 · 권장 조치</text></g><g data-cell-id="fallback-gate"><title>fallback-gate — aiops/pipeline/main.py:271</title><rect x="450" y="480" width="270" height="140" rx="12" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="585.0" y="511.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="17" font-weight="600" fill="#263343">Pipeline: fallback 검사</text><text x="585.0" y="537.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">confidence=0 +</text><text x="585.0" y="563.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">action_type=NONE</text><text x="585.0" y="589.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">해당 시 Remediation 전달 생략</text></g><g data-cell-id="remediation"><title>remediation — docker-compose.yml:368</title><rect x="60" y="790" width="300" height="140" rx="12" fill="#f8cecc" stroke="#b85450" stroke-width="2" stroke-dasharray="7 5"/><text x="210.0" y="834.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="17" font-weight="600" fill="#263343">Remediation /action</text><text x="210.0" y="860.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">현재 중지 유지</text><text x="210.0" y="886.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">기동 시 위험도·신뢰도로 분기</text></g><g data-cell-id="docker-actions"><title>docker-actions — aiops/remediation/main.py:72</title><rect x="450" y="790" width="270" height="140" rx="12" fill="#f8cecc" stroke="#b85450" stroke-width="2" stroke-dasharray="7 5"/><text x="585.0" y="834.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="17" font-weight="600" fill="#263343">Docker API 조치</text><text x="585.0" y="860.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">RESTART · ISOLATE</text><text x="585.0" y="886.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">PAUSE · THROTTLE</text></g><g data-cell-id="slack"><title>slack — aiops/remediation/actions/notify.py:61</title><rect x="830" y="790" width="270" height="140" rx="12" fill="#f5f5f5" stroke="#666666" stroke-width="2" stroke-dasharray="7 5"/><text x="965.0" y="821.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="17" font-weight="600" fill="#263343">Slack 연계</text><text x="965.0" y="847.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">승인 요청 또는 알림</text><text x="965.0" y="873.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">Webhook + 별도 interactivity</text><text x="965.0" y="899.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">필요</text></g><g data-cell-id="grafana"><title>grafana — docker-compose.yml:306</title><rect x="1220" y="790" width="300" height="140" rx="12" fill="#f5f5f5" stroke="#666666" stroke-width="2"/><text x="1370.0" y="834.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="17" font-weight="600" fill="#263343">Grafana 결과 확인</text><text x="1370.0" y="860.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">Prometheus 메트릭 + Loki 로그</text><text x="1370.0" y="886.0" text-anchor="middle" dominant-baseline="middle" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">RCA·조치 타임라인 조회</text></g><text x="60" y="62" font-family="Malgun Gothic,sans-serif" font-size="28" font-weight="700" fill="#263343">Alert → Context → LLM RCA → Remediation</text><text x="60" y="99" font-family="Malgun Gothic,sans-serif" font-size="15" font-weight="400" fill="#263343">Pipeline 내부 처리 단계와 외부 서비스를 구분한 흐름이다. 현재 Remediation 중지로 아래 점선 경로는 실행되지 않는다.</text><text x="370" y="217" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">Alert</text><text x="430" y="427" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">Ruler Alert</text><text x="730" y="217" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">webhook</text><text x="1110" y="217" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">유효 대상</text><text x="1240" y="397" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">프롬프트 + JSON 스키마</text><text x="1100" y="517" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">분석 응답</text><text x="730" y="517" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">분석 기록 후</text><text x="250" y="737" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">fallback이 아닌 경우 전달 시도</text><text x="365" y="827" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">조건 충족</text><text x="600" y="947" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">승인 필요 / 알림만</text><text x="1090" y="667" font-family="Malgun Gothic,sans-serif" font-size="13" font-weight="400" fill="#263343">Loki 데이터 소스 조회</text><text x="60" y="1018" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">자동 조치 조건은 low risk + confidence ≥0.7 + 대상 목록이다. 대상 컨테이너를 결정할 수 없으면 LLM 호출을 생략한다.</text><text x="60" y="1039" font-family="Malgun Gothic,sans-serif" font-size="14" font-weight="400" fill="#263343">Slack 승인 실행은 RESTART/ISOLATE만 지원하며 SCALE은 미구현이다. ±5분은 조회 범위이며 미래 데이터를 기다리지 않는다.</text></svg>