# M5-A offline candidate/reference only; not mounted or deployed. Do not edit.
groups:
- name: m5-reference-legacy-sqli
  rules:
  - alert: SQLInjectionAttempt
    expr: |
      sum(count_over_time(
        {service="frontend"} |~ "(?i)(union.{0,3}select|or.{0,3}1=1|drop.{0,3}table|sleep\\(|extractvalue|information_schema|admin'--|and.{0,3}1=1)" [2m]
      )) > 5
    for: 0m
    labels:
      severity: warning
      category: security
    annotations:
      summary: SQL Injection 시도 패턴 탐지
      container: leafy-frontend
