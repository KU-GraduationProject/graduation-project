# M5-A offline candidate/reference only; not mounted or deployed. Do not edit.
groups:
- name: m5-legacy_metrics-aiops-alerts
  rules:
  - alert: HighPostgresConnections
    expr: pg_stat_activity_count > 40
    for: 30s
    labels:
      severity: warning
      category: security
    annotations:
      summary: PostgreSQL 동시 연결 수 과다 (서비스 과부하 또는 연결 누수)
      container: leafy-db
- name: m5-m2_metrics-m2-static-prometheus
  rules:
  - alert: HighNginxRequestRate
    expr: rate(nginx_http_requests_total{job="nginx-exporter"}[1m]) > 30
    for: 30s
    labels:
      severity: warning
      category: security
      rulepack_target: leafy-web
    annotations:
      summary: Nginx 요청량 급증 (잠재적 SQLi/DDoS/스캔)
      container: leafy-frontend
- name: m5-m2_infra-m2-2-static-infra
  rules:
  - alert: HighCpuUsage
    expr: |
      sum by (name) (
        irate(container_cpu_usage_seconds_total{id=~"/docker/.+",cpu="total", instance="cadvisor:8080", job="cadvisor"}[30s])
        * on(id) group_left(name) container_name_info{instance="pipeline:8000", job="pipeline-metadata"}
      ) > 0.5 and on(name) container_name_info{instance="pipeline:8000", job="pipeline-metadata", name="leafy-frontend"}
    for: 30s
    labels:
      severity: warning
      category: infra
      rulepack_target: leafy-frontend
    annotations:
      summary: 컨테이너 CPU 사용률 50% 초과
      container: leafy-frontend
  - alert: HighCpuUsage
    expr: |
      sum by (name) (
        irate(container_cpu_usage_seconds_total{id=~"/docker/.+",cpu="total", instance="cadvisor:8080", job="cadvisor"}[30s])
        * on(id) group_left(name) container_name_info{instance="pipeline:8000", job="pipeline-metadata"}
      ) > 0.5 and on(name) container_name_info{instance="pipeline:8000", job="pipeline-metadata", name="leafy-backend"}
    for: 30s
    labels:
      severity: warning
      category: infra
      rulepack_target: leafy-backend
    annotations:
      summary: 컨테이너 CPU 사용률 50% 초과
      container: leafy-backend
  - alert: ContainerRestarted
    expr: |
      max by (name) (
        sum_over_time(
          (
            (
              last_over_time(aiops_docker_container_restarts_total{instance="pipeline:8000", job="pipeline-metadata", name="leafy-backend"}[10m])
              - last_over_time(aiops_docker_container_restarts_total{instance="pipeline:8000", job="pipeline-metadata", name="leafy-backend"}[10m] offset 5s)
            ) >= 0
            or
            (
              last_over_time(aiops_docker_container_restarts_total{instance="pipeline:8000", job="pipeline-metadata", name="leafy-backend"}[10m])
              < last_over_time(aiops_docker_container_restarts_total{instance="pipeline:8000", job="pipeline-metadata", name="leafy-backend"}[10m] offset 5s)
            ) + 0
          )[10m:5s]
        )
      ) >= 2 or max by (name) (
        changes(aiops_docker_container_started_at_seconds{instance="pipeline:8000", job="pipeline-metadata", name="leafy-backend"}[10m])
      ) >= 2
    for: 0m
    keep_firing_for: 2m
    labels:
      severity: critical
      category: infra
      rulepack_target: leafy-backend
    annotations:
      summary: 컨테이너 반복 재시작 감지 (10분 내 2회 이상, CrashLoop/OOM 가능성)
      container: leafy-backend
  - alert: HighCpuUsage
    expr: |
      sum by (name) (
        irate(container_cpu_usage_seconds_total{id=~"/docker/.+",cpu="total", instance="cadvisor:8080", job="cadvisor"}[30s])
        * on(id) group_left(name) container_name_info{instance="pipeline:8000", job="pipeline-metadata"}
      ) > 0.5 and on(name) container_name_info{instance="pipeline:8000", job="pipeline-metadata", name="leafy-db"}
    for: 30s
    labels:
      severity: warning
      category: infra
      rulepack_target: leafy-db
    annotations:
      summary: 컨테이너 CPU 사용률 50% 초과
      container: leafy-db
  - alert: HighCpuUsage
    expr: |
      sum by (name) (
        irate(container_cpu_usage_seconds_total{id=~"/docker/.+",cpu="total", instance="cadvisor:8080", job="cadvisor"}[30s])
        * on(id) group_left(name) container_name_info{instance="pipeline:8000", job="pipeline-metadata"}
      ) > 0.5 and on(name) container_name_info{instance="pipeline:8000", job="pipeline-metadata", name="leafy-minio"}
    for: 30s
    labels:
      severity: warning
      category: infra
      rulepack_target: leafy-minio
    annotations:
      summary: 컨테이너 CPU 사용률 50% 초과
      container: leafy-minio
- name: m5-m2_resources-m2-3-static-resources
  rules:
  - alert: HighMemoryUsage
    expr: |
      max by (name) (
        (
          container_memory_working_set_bytes{id=~"/docker/.+", instance="cadvisor:8080", job="cadvisor"}
          / (container_spec_memory_limit_bytes{id=~"/docker/.+", instance="cadvisor:8080", job="cadvisor"} > 0)
        ) * on(id) group_left(name) container_name_info{instance="pipeline:8000", job="pipeline-metadata"}
      ) > 0.85
    for: 5m
    labels:
      severity: warning
      category: infra
      rulepack_source: integrated
    annotations:
      summary: 컨테이너 메모리 사용률(working set) 85% 5분 이상 초과
      container: '{{ $labels.name }}'
  - alert: HighNetworkReceive
    expr: |
      (
        sum by (name) (
          rate(container_network_receive_bytes_total{interface!="lo", id=~"/docker/.+", name!="", name=~"leafy-frontend|leafy-backend|leafy-db|leafy-minio", instance="cadvisor:8080", job="cadvisor"}[1m])
        ) > 1e7
      ) or (
        (
          sum without (interface) (
            rate(container_network_receive_bytes_total{interface!="lo", id="/", instance="cadvisor:8080", job="cadvisor"}[1m])
          ) > 1e7
        )
        unless on ()
        (count(container_network_receive_bytes_total{id=~"/docker/.+", instance="cadvisor:8080", job="cadvisor"}) > 0)
      )
    for: 30s
    labels:
      severity: warning
      category: security
      rulepack_source: integrated
    annotations:
      summary: 네트워크 수신량 급증 (잠재적 DDoS/스캔)
      container: '{{ if $labels.name }}{{ $labels.name }}{{ else }}unknown (host-level){{ end }}'
